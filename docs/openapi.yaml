openapi: 3.0.3
info:
  title: OY Shop API
  version: 0.1.0
  description: |
    HTTP API for the shop catalog, cart, addresses, checkout, and admin fulfillment.
    Account routes (`/api/auth`, `/api/me`, `/api/profile`) are documented in `docs/api.md`.
    Money amounts are integers in toman. Records include Persian and English fields.
    There is no payment gateway in this version. A new order stores provider `unassigned`.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Catalog
  - name: Shipping
  - name: Cart
  - name: Addresses
  - name: Orders
  - name: Admin
paths:
  /api/products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: List published products
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/ProductType"
      responses:
        "200":
          description: Published products with active variants and images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "400":
          $ref: "#/components/responses/ValidationError"
  /api/products/{slug}:
    get:
      tags: [Catalog]
      operationId: getProduct
      summary: Get one published product
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The published product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/shipping-methods:
    get:
      tags: [Shipping]
      operationId: listShippingMethods
      summary: List active shipping methods
      responses:
        "200":
          description: Active shipping methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingMethodListEnvelope"
  /api/cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: Read the signed-in customer's cart
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Cart lines. An account with no cart returns an empty list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/cart/items:
    put:
      tags: [Cart]
      operationId: saveCartItem
      summary: Add quantity to a cart line
      description: |
        Quantity greater than 0 adds that many units to the existing line.
        The result cannot exceed stock. Quantity 0 removes the line.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemWrite"
      responses:
        "200":
          description: The updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRule"
  /api/cart/items/{variantId}:
    delete:
      tags: [Cart]
      operationId: deleteCartItem
      summary: Remove one cart line
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/VariantId"
      responses:
        "200":
          description: The updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/addresses:
    get:
      tags: [Addresses]
      operationId: listAddresses
      summary: List the signed-in customer's addresses
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Saved addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [Addresses]
      operationId: createAddress
      summary: Save an Iranian delivery address
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressWrite"
      responses:
        "201":
          description: The saved address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/addresses/{addressId}:
    patch:
      tags: [Addresses]
      operationId: updateAddress
      summary: Update one of the customer's addresses
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AddressId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressUpdate"
      responses:
        "200":
          description: The updated address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Addresses]
      operationId: deleteAddress
      summary: Delete one of the customer's addresses
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AddressId"
      responses:
        "200":
          description: The deleted address id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedIdEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List the signed-in customer's orders
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Orders, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [Orders]
      operationId: placeOrder
      summary: Check out the cart
      description: |
        Places the cart in one database transaction. Stock is reduced, the cart is cleared,
        and the order stays `pending_payment` for 30 minutes. Discount is 0.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrder"
      responses:
        "201":
          description: The placed order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRule"
  /api/orders/{orderNumber}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Read one of the customer's orders
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrderNumber"
      responses:
        "200":
          description: The order, including line snapshots and payment attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/shop/colors:
    post:
      tags: [Admin]
      operationId: createColor
      summary: Create a color
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColorWrite"
      responses:
        "201":
          description: The created color
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColorEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/shop/colors/{colorId}:
    patch:
      tags: [Admin]
      operationId: updateColor
      summary: Update a color
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ColorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColorUpdate"
      responses:
        "200":
          description: The updated color
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColorEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/shop/sizes:
    post:
      tags: [Admin]
      operationId: createSize
      summary: Create a size
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SizeWrite"
      responses:
        "201":
          description: The created size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SizeEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/shop/sizes/{sizeId}:
    patch:
      tags: [Admin]
      operationId: updateSize
      summary: Update a size
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SizeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SizeUpdate"
      responses:
        "200":
          description: The updated size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SizeEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/shop/products:
    post:
      tags: [Admin]
      operationId: createProduct
      summary: Create a design
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductWrite"
      responses:
        "201":
          description: The created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/shop/products/{productId}:
    patch:
      tags: [Admin]
      operationId: updateProduct
      summary: Update a design
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: The updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/shop/products/{productId}/images:
    post:
      tags: [Admin]
      operationId: createProductImage
      summary: Add a product image
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductImageWrite"
      responses:
        "201":
          description: The created image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImageEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/shop/images/{imageId}:
    patch:
      tags: [Admin]
      operationId: updateProductImage
      summary: Update a product image
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ImageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductImageUpdate"
      responses:
        "200":
          description: The updated image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImageEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/shop/products/{productId}/variants:
    post:
      tags: [Admin]
      operationId: createVariant
      summary: Add a color and size
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantWrite"
      responses:
        "201":
          description: The created variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVariantEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/shop/variants/{variantId}:
    patch:
      tags: [Admin]
      operationId: updateVariant
      summary: Update a variant
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/VariantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantUpdate"
      responses:
        "200":
          description: The updated variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVariantEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Admin]
      operationId: deleteVariant
      summary: Delete a variant that has never been ordered
      description: A variant that appears on an order cannot be deleted. Set `isActive` to false instead.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/VariantId"
      responses:
        "200":
          description: The deleted variant id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedIdEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/shop/shipping-methods:
    post:
      tags: [Admin]
      operationId: createShippingMethod
      summary: Create a shipping method
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShippingMethodWrite"
      responses:
        "201":
          description: The created shipping method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminShippingMethodEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/admin/shop/shipping-methods/{shippingMethodId}:
    patch:
      tags: [Admin]
      operationId: updateShippingMethod
      summary: Update a shipping method
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ShippingMethodId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShippingMethodUpdate"
      responses:
        "200":
          description: The updated shipping method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminShippingMethodEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/shop/orders/{orderNumber}:
    patch:
      tags: [Admin]
      operationId: updateFulfillment
      summary: Move an order through fulfillment
      description: |
        Allowed moves are `paid` to `processing`, `processing` to `shipped`, `shipped` to `delivered`,
        and `pending_payment`, `paid`, or `processing` to `cancelled`.
        Shipped requires a tracking code. Cancellation restores stock when the order still holds it.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrderNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Fulfillment"
      responses:
        "200":
          description: The updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRule"
  /api/admin/shop/orders/{orderNumber}/payment:
    post:
      tags: [Admin]
      operationId: recordPaymentResult
      summary: Record success or failure of the pending payment
      description: |
        The order must be `pending_payment`. Success after the payment window is rejected.
        Failure restores stock and sets `payment_failed`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrderNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentResult"
      responses:
        "200":
          description: The updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRule"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: |
        Better Auth session cookie sent by the browser. In production the cookie name is
        `__Secure-better-auth.session_token`. Admin routes also require role `admin`.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    VariantId:
      name: variantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderNumber:
      name: orderNumber
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        example: OY-10000
    ColorId:
      name: colorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SizeId:
      name: sizeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImageId:
      name: imageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShippingMethodId:
      name: shippingMethodId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ValidationError:
      description: The request body or query failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: No session cookie
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The account is not an administrator
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The record does not exist for this caller
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: A unique value already exists, or a variant on an order cannot be deleted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BusinessRule:
      description: The cart, stock, payment window, or status transition rejected the change
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ProductType:
      type: string
      enum: [tshirt, hoodie]
    OrderStatus:
      type: string
      enum:
        - pending_payment
        - paid
        - processing
        - shipped
        - delivered
        - cancelled
        - payment_failed
    PaymentStatus:
      type: string
      enum: [pending, succeeded, failed]
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - BUSINESS_RULE
                - RATE_LIMITED
                - SERVICE_UNAVAILABLE
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
    EmbeddedColor:
      type: object
      required: [id, nameFa, nameEn, hex]
      properties:
        id:
          type: string
